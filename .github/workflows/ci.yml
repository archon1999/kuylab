name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Scan repository history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_DB: kuylab_test
          POSTGRES_USER: kuylab
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kuylab -d kuylab_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONUNBUFFERED: '1'
      TEST_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '0' }}
      POSTGRES_DB: kuylab_test
      POSTGRES_USER: kuylab
      POSTGRES_PASSWORD: ci-only-ephemeral-password
      POSTGRES_HOST: 127.0.0.1
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install poetry==2.3.2
      - run: poetry check --lock
      - run: poetry install --no-interaction --no-root
      - run: poetry run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Audit pinned MIDI performances
        if: matrix.database == 'sqlite'
        run: poetry run python manage.py audit_midi_catalog --settings=config.settings.test
      - run: poetry run python manage.py test tests --settings=config.settings.test --noinput --parallel 2 --verbosity 2
      - name: Audit locked Python dependencies
        if: matrix.database == 'sqlite'
        run: |
          pip install pip-audit==2.10.1
          python ../ops/audit_dependencies.py /tmp/kuylab-requirements.txt
          pip-audit --disable-pip --no-deps -r /tmp/kuylab-requirements.txt
      - name: Production security checks
        env:
          DJANGO_SECRET_KEY: ci-only-security-check-00000000000000000000000000000000000000
        run: poetry run python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker build -t kuylab-backend:ci backend
      - run: docker build -t kuylab-frontend:ci frontend
      - name: Run production containers and smoke checks
        env:
          RELEASE_SHA: ci
        run: |
          sudo mkdir -p /etc/kuylab
          python - <<'PY' | sudo tee /etc/kuylab/production.env >/dev/null
          import secrets
          print('DJANGO_SETTINGS_MODULE=config.settings.production')
          print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64))
          print('POSTGRES_DB=kuylab\nPOSTGRES_USER=kuylab\nPOSTGRES_HOST=db')
          print('POSTGRES_PASSWORD=ephemeral-container-ci-password')
          PY
          sudo cp /etc/kuylab/production.env /etc/kuylab/database.env
          docker compose up -d --wait db
          docker compose run --rm backend python manage.py migrate --noinput
          docker compose run --rm backend python manage.py createcachetable
          docker compose run --rm backend python manage.py seed_studio
          # Exercise the existing-score path under the same memory limit.
          docker compose run --rm backend python manage.py seed_studio
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T backend python manage.py shell < ops/smoke.py
      - name: Container diagnostics and cleanup
        if: always()
        env: {RELEASE_SHA: ci}
        run: |
          docker compose logs --tail 60 || true
          docker compose down -v || true
  checks:
    name: CI passed
    if: always()
    needs: [frontend, backend, containers, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://kuylab.uz
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy verified main commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/kuylab
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/kuylab' EXIT
          ssh -i ~/.ssh/kuylab -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "kuylab-deploy@$HOST" "deploy $SHA"
