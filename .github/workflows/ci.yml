name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kuylab_test
          POSTGRES_USER: kuylab
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kuylab -d kuylab_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '0' }}
      POSTGRES_DB: kuylab_test
      POSTGRES_USER: kuylab
      POSTGRES_PASSWORD: ci-only-ephemeral-password
      POSTGRES_HOST: 127.0.0.1
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: pip install poetry==2.3.2
      - run: poetry check --lock
      - run: poetry install --no-interaction --no-root
      - run: poetry run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: poetry run python manage.py test tests --settings=config.settings.test --noinput
      - name: Production security checks
        env:
          DJANGO_SECRET_KEY: ci-only-security-check-00000000000000000000000000000000000000
        run: poetry run python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker build -t kuylab-backend:ci backend
      - run: docker build -t kuylab-frontend:ci frontend
  checks:
    name: CI passed
    if: always()
    needs: [frontend, backend, containers]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://kuylab.uz
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy verified main commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/kuylab
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/kuylab' EXIT
          ssh -i ~/.ssh/kuylab -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "kuylab-deploy@$HOST" "deploy $SHA"
