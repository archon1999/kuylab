map $http_x_forwarded_proto $kuylab_proto {
    default http;
    https https;
}
map $uri $kuylab_robots {
    default "";
    ~^/(studio(?:\.html)?|compositions|practice|lessons|study|exercises|theory|statistics|settings|404)(/|$) "noindex, follow";
    /404.html "noindex, follow";
    /licenses.html "noindex, follow";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $kuylab_robots always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __BOOT_CSP_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    error_page 404 /404.html;
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $kuylab_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 65s;
        proxy_no_cache 1;
    }
    location /media/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /audio/ {
        try_files $uri =404;
        expires 7d;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/(studio|compositions|practice|lessons|study|exercises|theory|statistics|settings|404)(/|$) {
        expires -1;
        try_files /studio.html =404;
    }
    location = /studio.html { expires -1; }
    location = /index.html { return 308 /$is_args$args; }
    location = / {
        if ($arg_page != "") { return 302 /studio$is_args$args; }
        expires -1;
        try_files /index.html =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
