map $http_x_forwarded_proto $kuylab_proto {
    default http;
    https https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __BOOT_CSP_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $kuylab_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 65s;
        proxy_no_cache 1;
    }
    location /media/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location /audio/ {
        try_files $uri =404;
        expires 7d;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
