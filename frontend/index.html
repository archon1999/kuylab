<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="description" content="KuyLab — shaxsiy pianino studiyangiz." />
    <title>KuyLab — shaxsiy pianino studiyangiz</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('kuylab-theme') === 'dark' ? 'dark' : 'light';
        const language = localStorage.getItem('kuylab-language');
        if (['uz', 'ru', 'en'].includes(language)) document.documentElement.lang = language;
      } catch {}
    </script>
    <style>
      html { background:#faf8f5; } html[data-theme='dark'] { background:#18122b; }
      body { margin:0; }
      .boot-screen { min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; color:#a47148; background:#faf8f5; }
      [data-theme='dark'] .boot-screen { background:#18122b; color:#eba165; }
      .boot-screen img { width:76px; height:76px; }
      .boot-screen strong { font:600 30px Georgia,serif; letter-spacing:-1px; }
      .boot-progress { width:72px; height:3px; margin-top:12px; border-radius:4px; background:#a4714822; overflow:hidden; }
      .boot-progress i { display:block; width:30px; height:100%; background:currentColor; animation:boot-travel 1.5s ease-in-out infinite alternate; }
      .boot-retry { font:14px system-ui,sans-serif; padding:10px 18px; border:1px solid currentColor; border-radius:8px; color:inherit; background:transparent; cursor:pointer; }
      .boot-retry[hidden] { display:none; }
      .boot-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
      @keyframes boot-travel { to { transform:translateX(42px); } }
      @media(prefers-reduced-motion:reduce) { .boot-progress i { animation:none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="KuyLab">
        <img src="/favicon.svg" alt="" width="76" height="76" />
        <strong>KuyLab</strong>
        <span class="boot-sr" id="boot-status">Yuklanmoqda…</span>
        <span class="boot-progress" aria-hidden="true"><i></i></span>
        <button class="boot-retry" id="boot-retry" hidden>Qayta urinish</button>
      </div>
    </div>
    <script>
      (() => {
        const lang = document.documentElement.lang;
        const status = document.getElementById('boot-status');
        const retry = document.getElementById('boot-retry');
        status.textContent = lang === 'ru' ? 'Загрузка…' : lang === 'en' ? 'Loading…' : 'Yuklanmoqda…';
        retry.textContent = lang === 'ru' ? 'Попробовать снова' : lang === 'en' ? 'Try again' : 'Qayta urinish';
        retry.addEventListener('click', () => location.reload());
        window.addEventListener('error', (event) => {
          if (!document.querySelector('.boot-screen')) return;
          if (event.target?.tagName === 'SCRIPT' || event.error) {
            status.textContent = lang === 'ru' ? 'Не удалось загрузить' : lang === 'en' ? 'Unable to load' : 'Yuklab bo‘lmadi';
            status.className = '';
            retry.hidden = false;
            document.querySelector('.boot-progress').hidden = true;
          }
        }, true);
      })();
    </script>
    <noscript><p style="text-align:center">KuyLab uchun JavaScript’ni yoqing. Enable JavaScript to open KuyLab.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
