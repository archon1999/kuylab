<!doctype html>

<html lang="en">
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>KuyLab piano audio verification</title>

  <style>
    body {
      font: 16px/1.6 system-ui;

      margin: 48px auto;

      padding: 0 24px;

      max-width: 900px;

      color: #25303b;

      background: #faf8f5;
    }

    button {
      font: inherit;

      border: 0;

      border-radius: 8px;

      background: #9d6b46;

      color: white;

      padding: 12px 20px;

      cursor: pointer;
    }

    pre {
      overflow: auto;

      padding: 20px;

      background: white;

      border-radius: 10px;
    }

    audio {
      width: 100%;
    }

    a {
      color: #80502c;
    }
  </style>

  <h1>Piano engine audition</h1>

  <p>
    Development verification using the real local sample bank and browser OfflineAudioContext. The
    Still excerpt below is an audio test, not a catalog asset.
  </p>

  <button id="render">Render audio checks</button>

  <p id="status" role="status">Ready.</p>

  <pre id="results"></pre>

  <section id="players"></section>

  <script type="module">
    import { createSampledPiano } from '/src/modules/practice/data-access/adapters/sampled-piano.adapter.ts';

    import { studioTimeline } from '/src/modules/practice/domain/studioTransport.ts';

    const status = document.querySelector('#status');

    const results = document.querySelector('#results');

    const players = document.querySelector('#players');

    const button = document.querySelector('#render');

    const urls = [];

    async function render(notes, seconds, reverb = 0.25, allKeys = false) {
      const offline = new OfflineAudioContext(2, Math.ceil(seconds * 44100), 44100);

      const piano = createSampledPiano(() => offline);

      try {
        piano.volume(1);
        piano.reverb(reverb);
        await piano.prepare(
          allKeys ? Array.from({ length: 88 }, (_, i) => i + 21) : notes.map((note) => note.pitch),
        );

        for (const note of notes)
          piano.sound(note.pitch, note.onset, note.duration, note.velocity, note.offset || 0);

        return await offline.startRendering();
      } finally {
        piano.close();
      }
    }

    function meters(buffer, from = 0, to = buffer.duration) {
      let squares = 0,
        count = 0,
        peak = 0,
        clipped = 0,
        finite = true;

      for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
        const data = buffer.getChannelData(channel);

        for (
          let index = Math.floor(from * buffer.sampleRate);
          index < Math.min(data.length, Math.floor(to * buffer.sampleRate));
          index++
        ) {
          const value = data[index];

          finite &&= Number.isFinite(value);

          squares += value * value;

          count++;

          peak = Math.max(peak, Math.abs(value));

          if (Math.abs(value) >= 1) clipped++;
        }
      }

      return {
        peak: +peak.toFixed(5),

        rms: +Math.sqrt(squares / count).toFixed(5),

        clippedSamples: clipped,

        finite,
      };
    }

    function wav(buffer) {
      const channels = buffer.numberOfChannels,
        bytes = buffer.length * channels * 2;

      const data = new ArrayBuffer(44 + bytes),
        view = new DataView(data);

      const text = (offset, value) =>
        [...value].forEach((letter, index) => view.setUint8(offset + index, letter.charCodeAt(0)));

      text(0, 'RIFF');

      view.setUint32(4, 36 + bytes, true);

      text(8, 'WAVE');

      text(12, 'fmt ');

      view.setUint32(16, 16, true);

      view.setUint16(20, 1, true);

      view.setUint16(22, channels, true);

      view.setUint32(24, buffer.sampleRate, true);

      view.setUint32(28, buffer.sampleRate * channels * 2, true);

      view.setUint16(32, channels * 2, true);

      view.setUint16(34, 16, true);

      text(36, 'data');

      view.setUint32(40, bytes, true);

      const tracks = Array.from({ length: channels }, (_, index) => buffer.getChannelData(index));

      let cursor = 44;

      for (let index = 0; index < buffer.length; index++)
        for (const track of tracks) {
          const value = Math.max(-1, Math.min(1, track[index]));

          view.setInt16(cursor, value < 0 ? value * 32768 : value * 32767, true);

          cursor += 2;
        }

      return new Blob([data], { type: 'audio/wav' });
    }

    function player(title, buffer, name) {
      const heading = document.createElement('h2');

      heading.textContent = title;

      const audio = document.createElement('audio');

      audio.controls = true;

      const url = URL.createObjectURL(wav(buffer));

      urls.push(url);

      audio.src = url;

      const link = document.createElement('a');

      link.href = url;

      link.download = name;

      link.textContent = 'Download WAV';

      players.append(heading, audio, link);
    }

    button.addEventListener('click', async () => {
      button.disabled = true;

      results.textContent = '';

      players.replaceChildren();

      urls.splice(0).forEach(URL.revokeObjectURL);

      try {
        status.textContent = 'Rendering real velocity layers…';

        const velocities = [25, 40, 41, 67, 68, 84, 85, 100, 101, 120];

        const dynamics = await render(
          velocities.map((velocity, index) => ({
            pitch: 60,

            onset: index * 1.3 + 0.05,

            duration: 0.6,

            velocity,
          })),

          velocities.length * 1.3 + 1,

          0,
        );

        const velocityLevels = velocities.map((velocity, index) => ({
          velocity,

          ...meters(dynamics, index * 1.3 + 0.1, index * 1.3 + 0.45),
        }));

        player('Recorded dynamics · C4', dynamics, 'kuylab-dynamics.wav');

        status.textContent = 'Checking dense forte chord headroom…';

        const chord = await render(
          [36, 48, 55, 60, 64, 67, 72, 76, 79, 84].map((pitch) => ({
            pitch,

            onset: 0.05,

            duration: 1.8,

            velocity: 127,
          })),

          3.5,

          0.25,
        );

        player('Dense forte chord', chord, 'kuylab-forte-check.wav');

        status.textContent = 'Rendering Winter Sonata — Still…';

        const response = await fetch('/api/scores/2/');

        if (!response.ok) throw new Error(`Score request failed (${response.status})`);

        const timeline = studioTimeline(await response.json());

        const excerptLength = 25;

        const still = await render(
          timeline.notes

            .filter((note) => note.onset < excerptLength)

            .map((note) => ({
              pitch: note.pitch,

              onset: note.onset,

              duration: Math.min(note.soundDuration, excerptLength - note.onset),

              velocity: note.velocity,
            })),

          excerptLength + 1.5,

          0.25,
        );

        player('Still · first 25 seconds', still, 'kuylab-still-preview-steinway.wav');

        status.textContent = 'Checking note release, stereo room and full Still playback…';

        const tailNote = [{ pitch: 60, onset: 0.05, duration: 0.5, velocity: 90 }];

        const dryTail = await render(tailNote, 3, 0);

        const wetTail = await render(tailNote, 3, 0.25);

        const maximumRoom = await render(
          [36, 48, 55, 60, 64, 67, 72, 76, 79, 84].map((pitch) => ({
            pitch,
            onset: 0.05,
            duration: 1.8,
            velocity: 127,
          })),
          4,
          1,
        );

        status.textContent =
          'Decoding all 226 samples and rendering the complete Still performance…';
        const fullStill = await render(
          timeline.notes.map((note) => ({
            pitch: note.pitch,
            onset: note.onset,
            duration: note.soundDuration,
            velocity: note.velocity,
          })),
          timeline.duration + 3,
          0.25,
          true,
        );

        player('Still · full performance', fullStill, 'kuylab-still-steinway.wav');

        const report = {
          engine:
            'Actual adapter + local 226-sample Steinway bank + Dattorro worklet + native OfflineAudioContext',

          velocityLevels,

          forte: meters(chord),

          still: meters(still),

          fullStill: meters(fullStill),

          maximumRoom: meters(maximumRoom),

          releaseAfterNoteOff: meters(dryTail, 0.62, 0.95),

          dryAfterRelease: meters(dryTail, 1.2, 2),

          roomAfterRelease: meters(wetTail, 1.2, 2),
        };

        results.textContent = JSON.stringify(report, null, 2);

        const safe =
          [report.forte, report.still, report.fullStill, report.maximumRoom].every(
            (result) => result.finite && result.peak > 0 && result.clippedSamples === 0,
          ) &&
          report.releaseAfterNoteOff.rms > 0 &&
          report.dryAfterRelease.peak === 0 &&
          report.roomAfterRelease.rms > 0;

        status.textContent = safe
          ? 'PASS · finite stereo audio, no clipped samples in the rendered checks. Listen below.'
          : 'Review the meters before approving this audio engine.';
      } catch (error) {
        status.textContent = String(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</html>
