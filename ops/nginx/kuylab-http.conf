# Bootstrap virtual host: no credentials over plaintext HTTP.
# Activate kuylab-https.conf after DNS and a valid certificate are available.
server {
    listen 80;
    listen [::]:80;
    server_name kuylab.uz www.kuylab.uz;
    location /.well-known/acme-challenge/ { root /var/www/kuylab-acme; }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "KuyLab is being prepared. HTTPS will be enabled after DNS is connected.\n";
    }
}
