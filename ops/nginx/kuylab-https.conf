limit_req_zone $binary_remote_addr zone=kuylab_auth:10m rate=5r/m;
server {
    listen 80;
    listen [::]:80;
    server_name kuylab.uz www.kuylab.uz;
    location /.well-known/acme-challenge/ { root /var/www/kuylab-acme; }
    location / { return 301 https://kuylab.uz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kuylab.uz www.kuylab.uz;
    ssl_certificate /etc/letsencrypt/live/kuylab.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuylab.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KuyLabSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 10m;
    access_log /var/log/nginx/kuylab.access.log;
    error_log /var/log/nginx/kuylab.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/auth/(login|register|password)/$ {
        limit_req zone=kuylab_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/kuylab-proxy.conf;
    }
    location / { include /etc/nginx/snippets/kuylab-proxy.conf; }
}
